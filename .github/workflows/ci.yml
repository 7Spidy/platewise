name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install root dependencies
        run: npm install

      - name: Install client dependencies
        run: npm --prefix client install

      - name: Build client
        run: npm --prefix client run build

      - name: Run tests
        run: npm test
